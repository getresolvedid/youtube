<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

    <!-- Tema + scene standar channel -->
    <link rel="stylesheet" href="shared/theme.css" />
    <link rel="stylesheet" href="shared/scenes.css" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
    </style>
  </head>

  <body>
    <!--
      KOMPOSISI UJI — membuktikan scene standar (opening + closing) benar-benar
      jalan, bukan hanya benar di atas kertas. Bukan episode.

      Susunan sengaja meniru posisi aslinya:
        0.0–2.0   filler "hook"  → membuktikan opening TIDAK di detik nol
        2.0–3.5   OPENING (brand sting, 1,5 dtk)
        3.5–5.5   filler isi
        5.5–10.5  CLOSING (end card 16:9, 5 dtk)
    -->
    <div
      id="root"
      class="hf-stage hf-16x9"
      data-composition-id="main"
      data-start="0"
      data-duration="10.5"
      data-width="1920"
      data-height="1080"
    >
      <!-- ===== filler: hook ===== -->
      <div class="scene clip" id="s1" data-start="0" data-duration="2"
           data-track-index="0" style="visibility:hidden;">
        <div class="scene-content center">
          <p class="t-label">uji scene standar</p>
          <h1 id="s1-title" class="t-title">Hook duluan.<br />Brand belakangan.</h1>
        </div>
      </div>

      <!-- ===== OPENING — brand sting, 1,5 dtk ===== -->
      <div class="scene clip sc-open" id="sc-open" data-start="2" data-duration="1.5"
           data-track-index="1" style="visibility:hidden;">
        <div class="scene-content">
          <div class="sting">
            <svg class="sting-mark" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="stingPlate" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#818CF8" /><stop offset="1" stop-color="#4338CA" />
                </linearGradient>
                <linearGradient id="stingDot" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#34D399" /><stop offset="1" stop-color="#10B981" />
                </linearGradient>
              </defs>
              <rect class="sting-plate" width="120" height="120" rx="30" fill="url(#stingPlate)" />
              <circle class="sting-ring" cx="60" cy="60" r="33" fill="none" stroke="#fff"
                      stroke-width="9" stroke-linecap="round" />
              <circle class="sting-dot" cx="60" cy="60" r="13" fill="url(#stingDot)" />
            </svg>
            <img class="sting-word" src="shared/assets/logos/getresolved-wordmark-inverse.svg" alt="" />
          </div>
        </div>
      </div>

      <!-- ===== filler: isi ===== -->
      <div class="scene clip" id="s2" data-start="3.5" data-duration="2"
           data-track-index="0" style="visibility:hidden;">
        <div class="scene-content center">
          <h2 id="s2-title" class="t-sub">Isi video jalan di sini</h2>
          <div class="rule" id="s2-rule"></div>
        </div>
      </div>

      <!-- ===== CLOSING — end card 16:9, 5 dtk ===== -->
      <div class="scene clip sc-close" id="sc-close" data-start="5.5" data-duration="5"
           data-track-index="1" style="visibility:hidden;">
        <div class="scene-content">
          <img class="close-mark" src="shared/assets/logos/getresolved-mark.svg" alt="" />
          <h2 class="close-cta">Masih penasaran <em>kenapa</em>?</h2>
          <div class="close-rule"></div>
          <p class="close-handle">@GetResolved</p>
          <p class="close-sub">Penjelasan teknologi, coding, dan engineering dalam Bahasa Indonesia.</p>
        </div>
      </div>
    </div>

    <script src="shared/scenes.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* --- filler: hook --- */
      tl.set("#s1", { autoAlpha: 1 }, 0);
      tl.from("#s1-title", { opacity: 0, y: 24, duration: 0.5, ease: "power3.out" }, 0.2);
      tl.set("#s1", { autoAlpha: 0 }, 2);

      /* --- OPENING (scene standar) --- */
      HFScenes.opening(tl, { at: 2 });

      /* --- filler: isi --- */
      tl.set("#s2", { autoAlpha: 1 }, 3.5);
      tl.from("#s2-title", { opacity: 0, y: 20, duration: 0.45, ease: "power3.out" }, 3.7);
      tl.from("#s2-rule", { scaleX: 0, transformOrigin: "left center", duration: 0.5, ease: "expo.out" }, 3.9);
      tl.set("#s2", { autoAlpha: 0 }, 5.5);

      /* --- CLOSING (scene standar) --- */
      HFScenes.closing(tl, { at: 5.5 });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
